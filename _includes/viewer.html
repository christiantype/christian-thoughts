{%- comment -%}
  Shared image viewer for /photography/ and /design/.

  Expects the including layout to have already emitted a
  <script id="viewer-data" type="application/json"> array of
  {"f": filename, "a": alt, "m": metadata-or-empty} and to pass:
    include.base — url prefix for the images, e.g. /assets/images/design/

  Two modes: slide (one photograph, arrows, metadata beneath) and grid
  (uniform thumbnails). The toggle sits with the metadata line; the chosen
  mode is remembered per page and reflected in the URL.
{%- endcomment -%}

<main class="site-viewer" data-base="{{ include.base }}">

  <nav class="viewer-modes" aria-label="View mode">
    <button type="button" data-mode="slide" class="active" aria-pressed="true" aria-label="Slide view" title="Slide">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7"  y="5" width="10" height="14" rx="1.5"/>
        <path d="M4 8.5v7M20 8.5v7"/>
      </svg>
    </button>
    <button type="button" data-mode="grid" aria-pressed="false" aria-label="Grid view" title="Grid">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5"  y="3.5"  width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="3.5"  width="7" height="7" rx="1.5"/>
        <rect x="3.5"  y="13.5" width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
      </svg>
    </button>
  </nav>

  <div class="viewer-stage">
    <button type="button" class="viewer-nav viewer-prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"/></svg>
    </button>

    <figure class="viewer-frame">
      <img id="viewer-img" alt="">
      <figcaption class="viewer-meta">
        <span class="viewer-exif"></span>
      </figcaption>
    </figure>

    <button type="button" class="viewer-nav viewer-next" aria-label="Next image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"/></svg>
    </button>
  </div>

  {%- comment -%}
    Photography lays its grid out as masonry, so a frame keeps the shape it was
    made in rather than being cropped square. Design does not: a poster sits on
    a ground and the ground is part of the piece, so those tiles stay equal.
  {%- endcomment -%}
  <div class="viewer-grid{% if include.masonry %} viewer-grid--masonry{% endif %}" hidden></div>

</main>

<script>
  (function () {
    const root  = document.querySelector('.site-viewer');
    const data  = document.getElementById('viewer-data');
    if (!root || !data) return;
    const BASE  = root.dataset.base;
    const THUMBS = {{ include.thumbs | default: '' | jsonify }};
    const all   = JSON.parse(data.textContent);
    if (!all.length) return;

    const img     = document.getElementById('viewer-img');
    const exifEl  = root.querySelector('.viewer-exif');
    const stage   = root.querySelector('.viewer-stage');
    const grid    = root.querySelector('.viewer-grid');
    const modes   = root.querySelectorAll('.viewer-modes button');
    const body    = document.body;

    let i = 0, mode = 'slide', gridBuilt = false;
    const cache = new Map();

    function preload(n) {
      const item = all[(n + all.length) % all.length];
      if (!item || cache.has(item.f)) return;
      const pre = new Image();
      pre.src = BASE + item.f;
      cache.set(item.f, pre);
    }

    function show(n) {
      i = (n + all.length) % all.length;
      const item = all[i];
      img.src = BASE + item.f;
      img.alt = item.a || '';
      setGround(img, item);
      exifEl.textContent  = item.m || '';
      preload(i + 1); preload(i - 1);
      syncURL();
    }

    /* Some work runs light right to its own edge, so on white there is
       nothing to say where it stops. Those pieces name a ground in
       _data/design_ground.yml; the image is then contained on it rather
       than cropped, and the ground shows around it as a margin. */
    function setGround(el, item) {
      const g = item.g || '';
      el.classList.toggle('on-ground', !!g);
      el.style.background = g || '';
    }

    // Grid is built once, on first switch — no cost while in slide mode.
    function buildGrid() {
      if (gridBuilt) return;
      const frag = document.createDocumentFragment();
      all.forEach((item, n) => {
        const fig = document.createElement('figure');
        fig.className = 'viewer-thumb';
        const el = document.createElement('img');
        el.src = BASE + item.f;
        /* A tile is drawn at about 360px on a desktop and 177px on a phone,
           and the original is 2048px wide: painting the grid out of the
           originals cost a first screen 25MB on a desktop and 31MB on a
           phone, for roughly a thirtieth of the pixels it used. The slide
           view still opens the original, so the photograph itself is
           untouched — only the thumbnail is made to the size of a thumbnail.
           bin/generate-photo-thumbs.py writes the two widths. The original
           stays last in the list, so a photograph whose thumbnails have not
           been built yet still loads, and a screen wide enough to want more
           than 840px gets the full file. */
        if (THUMBS) {
          const stem = item.f.replace(/\.[^.]+$/, '');
          el.srcset = THUMBS + stem + '-420.jpg 420w, ' +
                      THUMBS + stem + '-840.jpg 840w, ' +
                      BASE + item.f + ' 2048w';
          // Three tiles across above 900px against two below it, and the
          // container stops growing, so the wide case is a width and the
          // narrow one is a share of the screen.
          el.sizes = '(min-width: 900px) 370px, 48vw';
        }
        el.alt = item.a || '';
        el.loading = 'lazy';
        el.decoding = 'async';
        // The shape the frame was made in, from _data/photo_dims.yml. The CSS
        // reads --ar; a photograph without one keeps the square the whole grid
        // used to be, so a missing entry degrades to the old behaviour rather
        // than collapsing the tile to nothing.
        if (item.d && item.d[0] && item.d[1]) {
          fig.style.setProperty('--ar', item.d[0] + ' / ' + item.d[1]);
          el.width  = item.d[0];
          el.height = item.d[1];
        }
        setGround(el, item);
        fig.appendChild(el);
        // clicking a thumbnail opens it in slide mode
        fig.addEventListener('click', () => { show(n); setMode('slide'); });
        frag.appendChild(fig);
      });
      grid.appendChild(frag);
      gridBuilt = true;
    }

    /* Masonry without a library. The grid runs on 1px rows with no row gap,
       and each tile claims as many of them as it is tall — so a column packs
       tight while the order still reads left to right, which is what
       photo_order.yml means by newest first. A column-flow masonry would read
       top to bottom down column one instead, and put the newest photograph
       next to one from last year.

       Measured rather than calculated from the ratio: the tile's own height
       already accounts for the column width at this breakpoint, and the CSS
       aspect-ratio has reserved it before the file arrives. */
    const isMasonry = grid.classList.contains('viewer-grid--masonry');
    function layoutMasonry() {
      if (!isMasonry || !gridBuilt || grid.hidden) return;
      const cs   = getComputedStyle(grid);
      const row  = parseFloat(cs.gridAutoRows) || 1;
      const gap  = parseFloat(cs.rowGap) || 0;
      grid.querySelectorAll('.viewer-thumb').forEach(fig => {
        // Measure the image, not the figure. The figure is a grid item on 1px
        // rows, so before its span is set it IS one pixel tall — measuring it
        // would feed that pixel straight back in and every tile would collapse.
        // The image carries the aspect-ratio, so its height is already right.
        const img = fig.firstElementChild;
        const h = img ? img.getBoundingClientRect().height : 0;
        if (!h) return;
        const mb = parseFloat(getComputedStyle(fig).marginBottom) || 0;
        fig.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil((h + mb + gap) / (row + gap)));
      });
    }

    let relayout;
    addEventListener('resize', () => {
      clearTimeout(relayout);
      relayout = setTimeout(layoutMasonry, 120);
    });

    /* Where the reader was standing in the grid when they opened a frame. */
    let gridAt = null;

    function setMode(next) {
      /* Slide mode fixes the viewer to the viewport and takes the body's
         padding off, so the document collapses to a single screen and the
         browser clamps the scroll to the top. The place in the grid is kept
         here and handed back below, once the tiles have been measured again,
         so closing a photograph returns the reader to the photograph instead
         of to the masthead. */
      const from = mode;
      if (from === 'grid' && next !== 'grid') gridAt = window.scrollY;

      mode = next;
      if (mode === 'grid') buildGrid();
      stage.hidden = mode !== 'slide';
      grid.hidden  = mode !== 'grid';
      /* These two classes decide the body's padding and whether the viewer is
         fixed — which is to say they decide how wide a column is. They have to
         be on BEFORE the masonry measures. Measured under the outgoing mode,
         every tile is sized at the full-bleed width it had in slide mode and
         given a row span that does not match the width it is about to be drawn
         at, which is the gap-riddled grid you get on closing a photograph. */
      body.classList.toggle('mode-grid', mode === 'grid');
      body.classList.toggle('mode-slide', mode === 'slide');
      if (mode === 'grid') {
        layoutMasonry();
        if (from && from !== 'grid' && gridAt != null) {
          // Reading the height forces the new spans to lay out, so the
          // document is tall enough to accept the scroll back.
          void document.documentElement.scrollHeight;
          window.scrollTo(0, gridAt);
        }
        gridAt = null;
      }
      modes.forEach(b => {
        const on = b.dataset.mode === mode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      try { localStorage.setItem('viewerMode:' + location.pathname, mode); } catch (e) {}
      syncURL();
    }

    function syncURL() {
      const url = new URL(window.location);
      mode === 'grid' ? url.searchParams.set('v', 'grid') : url.searchParams.delete('v');
      mode === 'slide' ? url.searchParams.set('i', i + 1) : url.searchParams.delete('i');
      history.replaceState(null, '', url);
    }

    root.querySelector('.viewer-prev').addEventListener('click', () => show(i - 1));
    root.querySelector('.viewer-next').addEventListener('click', () => show(i + 1));
    modes.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

    document.addEventListener('keydown', e => {
      if (mode !== 'slide') return;
      if (e.key === 'ArrowLeft') show(i - 1);
      else if (e.key === 'ArrowRight') show(i + 1);
      else if (e.key === 'Home') show(0);
      else if (e.key === 'End') show(all.length - 1);
      else if (e.key === 'Escape') setMode('grid');   // exit fullscreen → grid
    });

    let x0 = null;
    stage.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, {passive: true});
    stage.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
      x0 = null;
    }, {passive: true});

    // Restore: URL wins, then last-used mode for this page. Grid is the
    // default landing — the header and site are visible; clicking a photo
    // (or the slide toggle) enters the fullscreen slideshow.
    const params = new URLSearchParams(window.location.search);
    const start  = parseInt(params.get('i'), 10);
    show(start && start >= 1 && start <= all.length ? start - 1 : 0);
    let saved = null;
    try { saved = localStorage.getItem('viewerMode:' + location.pathname); } catch (e) {}
    if (params.get('v') === 'grid') setMode('grid');
    else if (params.get('v') === 'slide' || params.has('i')) setMode('slide');
    else setMode(saved || 'grid');
  })();
</script>
