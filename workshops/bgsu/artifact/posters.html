<style>
  /* ── A sheet to a screen ────────────────────────────────────────────────
     The same move the Sidepiece spreads make: each poster takes a screen of
     its own and is centred on a ground, rather than scrolling past on the
     black. A poster is met on a surface — a wall, a table — so it is given
     one, and sized to the viewport so the whole sheet is in view at once
     without the reader doing anything.

     The ground is the counterweight to the sheet, not a decoration: the
     black sheet lies on paper grey, the white sheet on a deep slate pulled
     from its own blue. Two grounds that differ also stop the two stages
     bleeding into one as you scroll between them. */
  .poster-stage {
    /* Full bleed. The stage sits inside the page's container, so without
       this the ground stops at the measure and reads as a panel on the page
       rather than a surface the sheet is lying on — the same edge-to-edge
       the Sidepiece spreads take. */
    width: 100vw;
    margin-left: calc(50% - 50vw);
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--space-6);
    padding: calc(var(--header-h) + var(--space-8)) var(--space-8) var(--space-10);
    background: var(--ground, #e6e6e6);
    color: var(--on-ground, #111);
  }

  /* Height-led, not width-led. A poster is portrait, so what decides whether
     the whole sheet is on screen is the room left under the header — the
     width follows from the sheet's own proportions. */
  .poster-sheet { margin: 0; display: flex; flex-direction: column;
    align-items: center; gap: var(--space-4); }
  .poster-sheet img {
    display: block;
    max-height: calc(100svh - var(--header-h) - var(--space-8) - var(--space-10) - 5.5em);
    max-width: min(88vw, 46em);
    width: auto; height: auto;
    /* Depth: a contact shadow tight under the sheet and a soft cast well
       beyond it. One alone reads as a sticker; the pair reads as paper
       lifted off a surface. */
    box-shadow:
      0 1px 2px var(--shade-near, rgba(0,0,0,.16)),
      0 2px 8px var(--shade-near, rgba(0,0,0,.16)),
      0 28px 70px var(--shade-far, rgba(0,0,0,.26));
  }

  .poster-cap { display: flex; flex-wrap: wrap; gap: .4em var(--space-6);
    align-items: baseline; justify-content: center; text-align: center;
    font-family: var(--font-label); font-size: var(--tag); letter-spacing: .5px; }
  /* The ink is said on the caption and on everything in it. `inherit` was
     not enough: a project page paints figcaption white for its dark grounds,
     so on the paper-grey stage the label came out white on light grey at
     1.25:1 — there, and unreadable. The stage states its own ink. */
  .poster-stage .poster-cap,
  .poster-stage .poster-cap * { color: var(--on-ground, #111); }
  .poster-stage .poster-cap .m { opacity: .6; }

  /* Three sheets on one stage, read across. They are the same brief answered
     three ways, so they belong side by side rather than a screen apart — and
     they are shown as printed, footers and all, which is where the credit
     already lives. */
  .poster-row { display: flex; align-items: flex-end; justify-content: center;
    gap: clamp(16px, 2.4vw, 40px); width: 100%; }
  .poster-row img { display: block; width: auto; flex: 0 1 auto;
    max-height: calc(100svh - var(--header-h) - var(--space-8) - var(--space-10) - 5.5em);
    max-width: 30%;
    box-shadow:
      0 1px 2px var(--shade-near, rgba(0,0,0,.16)),
      0 2px 8px var(--shade-near, rgba(0,0,0,.16)),
      0 24px 60px var(--shade-far, rgba(0,0,0,.26)); }
  @media (max-width: 48em) {
    .poster-row { flex-direction: column; align-items: center; }
    .poster-row img { max-width: 86%; max-height: none; }
  }

  /* On a phone the header eats most of the screen, so the sheet takes the
     width it can and the stage shrinks to it rather than padding it out. */
  @media (max-width: 40em) {
    .poster-stage { min-height: 0; padding: var(--space-12) var(--space-6); }
    .poster-sheet img { max-height: none; max-width: 100%; }
  }
  /* The band the stages sit in keeps its own padding, so after the last
     sheet there was a strip of the showcase's black between the ground and
     the footer — a gap that read as a mistake because every stage above it
     runs edge to edge. The band gives up its padding when it holds stages,
     the same way it does for the Sidepiece spreads. */
  #images:has(.poster-stage) { padding-top: 0; padding-bottom: 0; }

  @media (prefers-reduced-motion: reduce) { .poster-sheet img { transition: none; } }
</style>
