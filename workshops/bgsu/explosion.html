<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP/AL hero — Heart, Intuition and Technology</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* The original OP/AL homepage hero (backups/index-hero-2026-07-07.html), alone, for one screen of the
     BGSU talk: the glass letters of /scene/ on black and the tapered slash growing through them, until
     the letters burst. (The "original practice / applied learning" line is left out, at Christian's ask.) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #hero { position: fixed; inset: 0; background: #000; }
  #hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* the still covers the scene until it reports that it has drawn, and stays if it never does */
  #fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; pointer-events: none; transition: opacity .7s ease; }
  #fallback.hide { opacity: 0; }
  #slash { position: absolute; left: 50%; top: 50%; width: 13px; height: 150%; background: #fff; z-index: 1; pointer-events: none;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    transform: translate(-50%, -50%) rotate(32deg) scaleY(0); transform-origin: center; opacity: 0;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, .4));
    transition: transform 8s cubic-bezier(.16, .84, .3, 1), opacity 1.4s ease; }
  #slash.go { transform: translate(-50%, -50%) rotate(32deg) scaleY(1); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #slash { transition: none; } }
</style>
</head>
<body>
<section id="hero">
  <iframe src="/workshops/bgsu/scene/" title="OP/AL" loading="eager" scrolling="no"></iframe>
  <img id="fallback" src="/workshops/bgsu/images/hero-fallback.webp?v=2" alt="" aria-hidden="true">
  <div id="slash" aria-hidden="true"></div>
</section>
<script>
  (function () {
    setTimeout(function () { document.getElementById('slash').classList.add('go'); }, 400);
    addEventListener('message', function (e) { if (e && e.data === 'opal:ready') document.getElementById('fallback').classList.add('hide'); });
  })();
</script>
</body>
</html>
