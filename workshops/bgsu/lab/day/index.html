<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Day — OP/AL</title>
  <meta name="robots" content="noindex, follow">
<meta name="description" content="Music for a day. Tell it what your day holds and it scores it, from now until you have had enough. Ambient, evolving, following the light where you are.">
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="stylesheet" href="/workshops/bgsu/shared/styles.css?v=20261011A">
<link rel="stylesheet" href="/workshops/bgsu/lab/day/transport.css?v=2">
<script src="/workshops/bgsu/assets/js/Tone.js"></script>
<style>
  /* ── A Day ──────────────────────────────────────────────────────────────
     A painting that takes a day to make.

     Kandinsky's claim in Point and Line to Plane — already the first citation
     in OP/AL's Sound study — is that a mark carries weight, direction, tension
     and a temporal character, and that these are the terms music uses because
     they were the only ones precise enough. Here the claim is taken literally:
     every sound puts a mark on the field, in the place and at the size the
     sound has, and the marks stay as long as they are audible. The picture is
     not a visualisation of the music. It is the same event, seen.

     The ground is the light where you are. It opens before dawn in deep indigo,
     comes up through the morning, holds pale at noon and goes down again. By
     evening you are looking at a different painting from the one you started. */
  :root { --pad: 3vw; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
  body { font-family: 'Untitled Sans', system-ui, sans-serif; color: #fff; }

  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Everything written is apparatus, so it is small, set in the label face, and
     stays out of the painting's way. */
  .d-ui { position: fixed; inset: 0; pointer-events: none; z-index: 5;
          display: grid; grid-template-rows: auto 1fr auto; padding: var(--pad); }
  /* Only the written parts take the pointer. The spacer between them was
     taking it too, and it covers the middle of the screen — so every drag
     across the day landed on an empty div instead of the field. */
  .d-top, .d-bot { pointer-events: auto; }

  .d-top { display: flex; justify-content: space-between; align-items: baseline; gap: 2em;
           font-size: var(--tag); letter-spacing: .5px; mix-blend-mode: difference; }
  .d-top b { font-weight: 400; }
  .d-now { font-variant-numeric: tabular-nums; opacity: .72; }

  .d-bot { display: flex; flex-wrap: wrap; gap: .75em 1.6em; align-items: flex-end;
           justify-content: space-between; }
  .d-marks { display: flex; flex-wrap: wrap; gap: .45em; }
  .d-mark { font: inherit; font-size: var(--tag); letter-spacing: .14em; text-indent: .14em;
            text-transform: uppercase; padding: .8em 1.4em; cursor: pointer;
            border: 1px solid rgba(255,255,255,.26); background: rgba(0,0,0,.14);
            color: #fff; backdrop-filter: blur(6px); transition: .18s; }
  .d-mark[aria-pressed="true"] { background: #fff; color: #0b0d14; border-color: #fff; }
  .d-mark:hover { border-color: rgba(255,255,255,.7); }
  .d-meta { font-size: var(--tag); letter-spacing: .5px; opacity: .6; line-height: 1.7;
            text-align: right; font-variant-numeric: tabular-nums; }

  /* Nothing sounds until it is asked for. */
  .d-gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
            cursor: pointer; background: radial-gradient(120% 90% at 50% 40%, #16203a 0%, #0b0d14 70%); }
  .d-gate__in { text-align: center; max-width: 34em; padding: 0 2em; }
  .d-gate__h { font-family: 'Signifier', Georgia, serif; font-weight: 400;
               font-size: clamp(2.4rem, 8vw, 5rem); line-height: 1.02; letter-spacing: -.015em;
               margin: 0 0 .6em; }
  .d-gate__p { font-size: var(--tag); letter-spacing: .5px; line-height: 1.9; opacity: .62;
               margin: 0 auto 2.6em; max-width: 26em; }
  .d-gate__go { font-size: var(--tag); letter-spacing: .14em; text-indent: .14em;
                text-transform: uppercase; border: 1px solid rgba(255,255,255,.55);
                padding: 1.05em 2.6em; display: inline-block; transition: .2s; }
  .d-gate:hover .d-gate__go { background: #fff; color: #0b0d14; border-color: #fff; }
  .is-on .d-gate { opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }

  .d-credit { position: fixed; left: var(--pad); bottom: var(--pad); z-index: 21;
              font-size: var(--tag); letter-spacing: .5px; opacity: .4; }
  .is-on .d-credit { display: none; }

  @media (max-width: 40em) {
    :root { --pad: 1.2em; }
    .d-bot { flex-direction: column; align-items: stretch; }
    .d-meta { text-align: left; }
  }
</style>
</head>
<body>

<canvas id="field"></canvas>

<div class="d-ui">
  <header class="d-top">
    <p><b>A Day</b></p>
    <p class="d-now" id="now">—</p>
  </header>
  <div></div>
  <footer class="d-bot">
    <div class="d-marks" id="marks"></div>
    <p class="d-meta"><span id="say">Drag across the field to put something on your day</span><br><span id="sky">—</span></p>
  </footer>
</div>

<div class="d-gate" id="gate">
  <div class="d-gate__in">
    <h1 class="d-gate__h">Music for a day.</h1>
    <p class="d-gate__p">
      Tell it what your day holds and it scores it, from now until you have had enough.
      Nothing repeats. It follows the light where you are, and the weather.
    </p>
    <span class="d-gate__go">Begin</span>
  </div>
</div>
<p class="d-credit">Produced by OP/AL</p>

<script src="/workshops/bgsu/lab/day/transport.js?v=1"></script>
<script src="/workshops/bgsu/lab/day/field.js?v=2"></script>
<script src="/workshops/bgsu/lab/day/day.js?v=7"></script>
</body>
</html>
